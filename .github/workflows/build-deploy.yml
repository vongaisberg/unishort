name: Build and deploy

# The pipeline itself lives in vongaisberg/ci-workflows -- shared with every
# other app on sun. What stays here is this repo's two environments:
# master -> production, dev -> the gated dev environment at
# app-unishort-dev.vongaisberg.de. Both push into the same Zot repository;
# tags are commit SHAs, so they cannot collide. A `v*` tag resolves to
# values.yaml, which is correct -- a release deploys production.
on:
  push:
    branches: [master, dev]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    uses: vongaisberg/ci-workflows/.github/workflows/build-deploy.yml@main
    with:
      image: unishort
      values_file: ${{ github.ref_name == 'dev' && 'apps/unishort/dev.yaml' || 'apps/unishort/values.yaml' }}
    secrets: inherit
